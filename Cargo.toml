[package]
name = "win-loop"
version = "0.1.0"
edition = "2024"
default-run = "win-loop"

[[bin]]
name = "win-loop-cli"
path = "src/cli.rs"

[dependencies]
anyhow = "1"
ctrlc = "3.5"
hound = "3.5"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Performance", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
